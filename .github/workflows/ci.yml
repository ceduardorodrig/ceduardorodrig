name: cvcheck

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: CV Audit (Rust Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: curriculum-vitae

      - uses: actions/checkout@v4
        with:
          repository: ceduardorodrig/SUMAENIMA-HUB
          path: sumaenima-hub
          ssh-key: ${{ secrets.STENIOCHECK_SSH_KEY }}

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sumaenima-hub/scripts/steniocheck-rs -> target

      - name: Compilar stenio-check (Release)
        run: cargo build --release --manifest-path sumaenima-hub/scripts/steniocheck-rs/Cargo.toml

      - name: Rodar stenio-check (perfil resume)
        working-directory: curriculum-vitae
        run: |
          ${{ github.workspace }}/sumaenima-hub/scripts/steniocheck-rs/target/release/stenio-check --tag resume --github-format
