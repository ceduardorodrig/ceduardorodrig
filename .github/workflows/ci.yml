name: cvcheck

# Governance audit of the resume by StenioSentinel.
#
# WHY IT CHANGED (2026-09-29): this workflow cloned SUMAENIMA-HUB, compiled
# `scripts/steniocheck-rs` and ran `--tag resume`. All three points rotted:
#   - `scripts/steniocheck-rs` was purged from the hub (commit 70d7132) and CI
#     started failing with "manifest path ... does not exist";
#   - the engine left the hub and lives in its own repository;
#   - `--tag resume` was replaced by `--scope cv`.
#
# It now uses the composite action published by the engine itself, which downloads
# the prebuilt binary (public release, no token) instead of compiling Rust here.
# A single source of truth for every repository that uses Stênio.

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: CV Audit (Rust Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: StenioSentinel — auditar currículo
        uses: ceduardorodrig/STENIO-SENTINEL/.github/actions/stenio-check@v1
        with:
          scope: cv
          path: .
          github-format: "true"
