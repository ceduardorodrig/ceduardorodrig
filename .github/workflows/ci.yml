name: cvcheck

# Auditoria de governança do currículo pelo StenioSentinel.
#
# POR QUE MUDOU (29/09/2026): este workflow clonava o SUMAENIMA-HUB, compilava
# `scripts/steniocheck-rs` e rodava `--tag resume`. Os três pontos apodreceram:
#   - `scripts/steniocheck-rs` foi purgado do hub (commit 70d7132) e o CI passou
#     a falhar com "manifest path ... does not exist";
#   - o motor saiu do hub e vive no seu próprio repositório;
#   - `--tag resume` foi substituído por `--scope cv`.
#
# Agora usa a composite action publicada pelo próprio motor, que baixa o binário
# já compilado (release pública, sem token) em vez de compilar Rust aqui.
# Uma única fonte de verdade para todos os repositórios que usam o Stênio.

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: CV Audit (Rust Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: StenioSentinel — auditar currículo
        uses: ceduardorodrig/STENIO-SENTINEL/.github/actions/stenio-check@v1
        with:
          scope: cv
          path: .
          github-format: "true"
